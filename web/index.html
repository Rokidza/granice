<!doctype html>
<html lang="hr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Granice – karta rizika prelaska</title>
  <!-- Tile and style servers of the default basemap: connect while the page is still loading. -->
  <link rel="preconnect" href="https://server.arcgisonline.com" crossorigin>
  <link rel="preconnect" href="https://tiles.openfreemap.org" crossorigin>
  <link rel="stylesheet" href="vendor/maplibre-gl.css">
  <link rel="stylesheet" href="style.css">
  <!-- Deferred scripts download beside the stylesheet and run, in order, once the page is parsed. -->
  <script defer src="vendor/maplibre-gl.js"></script>
  <script defer src="vendor/pmtiles.js"></script>
  <script defer src="vendor/basemaps.js"></script>
  <link rel="modulepreload" href="app.js">
</head>
<body>
  <div class="layout">
    <aside class="sidebar" aria-label="Upravljanje kartom">
      <header class="brand">
        <div>
          <h1>Granice</h1>
          <p>Hrvatska | BiH · mjesta na kojima se putovi približavaju granici</p>
        </div>
        <button type="button" id="panel-close" class="icon-button" title="Sakrij panel i vidi cijelu kartu" aria-label="Sakrij panel">‹</button>
      </header>

      <nav class="cards" role="tablist" aria-label="Vrsta mjesta">
        <button type="button" role="tab" id="tab-kopno" data-tab="kopno" class="card cat-kopno" aria-selected="false" tabindex="-1" aria-controls="pane-lista">
          <span class="card-top"><span class="card-icon" id="icon-kopno" aria-hidden="true"></span><span class="card-count" id="areas-count-kopno">0</span></span>
          <span class="card-label">Blizu granice</span>
        </button>
        <button type="button" role="tab" id="tab-rijeka" data-tab="rijeka" class="card cat-rijeka" aria-selected="false" tabindex="-1" aria-controls="pane-lista">
          <span class="card-top"><span class="card-icon" id="icon-rijeka" aria-hidden="true"></span><span class="card-count" id="areas-count-rijeka">0</span></span>
          <span class="card-label">Preko rijeke</span>
        </button>
        <button type="button" role="tab" id="tab-izravni" data-tab="izravni" class="card cat-izravni" aria-selected="true" aria-controls="pane-lista">
          <span class="card-top"><span class="card-icon" id="icon-izravni" aria-hidden="true"></span><span class="card-count" id="izravni-count">0</span></span>
          <span class="card-label">Izravni prelazi</span>
        </button>
      </nav>

      <div class="finder" id="finder">
        <div class="band-control" id="band-control" hidden>
          <p>Najbliži par staza <output id="band-value"></output></p>
          <div class="dual-range" id="band-range">
            <div class="dual-range-fill" id="band-fill" aria-hidden="true"></div>
            <input id="band-min" type="range" min="0" step="50" aria-label="Najbliži par staza od (m)">
            <input id="band-max" type="range" min="0" step="50" aria-label="Najbliži par staza do (m)">
          </div>
        </div>
        <div class="list-head">
          <div class="list-summary">
            <button type="button" id="izravni-toggle" class="summary-toggle" aria-expanded="false" aria-controls="izravni">
              <span id="izravni-summary" class="summary" aria-live="polite"></span>
              <span class="summary-chevron" aria-hidden="true"></span>
            </button>
            <p id="areas-summary-kopno" class="summary" aria-live="polite" hidden></p>
            <p id="areas-summary-rijeka" class="summary" aria-live="polite" hidden></p>
          </div>
        </div>
      </div>

      <div class="scroll" id="scroll">
        <div class="pane" id="pane-lista" role="tabpanel" data-pane="lista">
          <ol id="izravni" class="areas" data-cat="izravni" aria-label="Staze koje presijecaju granicu, klik zumira na kartu"></ol>
          <ol id="areas-kopno" class="areas" data-cat="kopno" aria-label="Područja gdje su staze s obje strane blizu granice, klik zumira na kartu" hidden></ol>
          <ol id="areas-rijeka" class="areas" data-cat="rijeka" aria-label="Područja gdje treba prijeći rijeku, klik zumira na kartu" hidden></ol>
        </div>

      </div>

    </aside>

    <main>
      <button type="button" id="panel-open" class="tool-button" title="Prikaži panel" hidden>☰ Panel</button>
      <div id="map" role="application" aria-label="Karta Staza i rizika prelaska"></div>
      <div class="map-tools">
        <div class="tool-row">
          <div id="basemap-choice" class="segmented" role="radiogroup" aria-label="Podloga karte"></div>
          <button type="button" id="measure-toggle" class="tool-button" aria-pressed="false" title="Zračna udaljenost između dvije točke">
            <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M1.5 10.5l9-9 4 4-9 9z" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/><path d="M5 6l1.5 1.5M7 4l1 1M9 2l1.5 1.5M3 8l1 1" stroke="currentColor" stroke-width="1.2"/></svg>
            Mjerenje
          </button>
          <button type="button" id="plain-toggle" class="tool-button" aria-pressed="false" title="Samo podloga s nazivima mjesta, bez staza, granice i oznaka">Čista snimka</button>
          <h2 id="map-title" class="map-title" aria-live="polite">
            <span id="map-title-icon" class="map-title-icon" aria-hidden="true"></span>
            <span><span class="map-title-lead">Prikaz riskantnih područja prelaska:</span> <span id="map-title-what"></span><span id="map-title-place" class="map-title-place"></span></span>
          </h2>
        </div>
        <div class="risk-key" role="note" aria-label="Boje granice">
          <button type="button" id="risk-high-open" class="risk-chip risk-high" title="Prikaži prvo kritično područje s popisa">VELIKI RIZIK OD MIGRANATA</button>
          <span class="risk-chip risk-low">MALI RIZIK</span>
        </div>
        <p id="measure-hint" class="map-hint" role="status"></p>
        <p id="basemap-status" class="map-status" role="status"></p>
      </div>
      <section id="map-legend" class="map-legend folded" aria-label="Legenda karte">
        <button type="button" id="map-legend-toggle" class="map-legend-head" aria-expanded="false" aria-controls="legend">
          <span>Legenda</span><span class="map-legend-chevron" aria-hidden="true"></span>
        </button>
        <div id="legend" class="map-legend-body"></div>
      </section>
      <div id="overview" class="overview hidden" role="img" title="Povucite crveni okvir ili kliknite da premjestite kartu" aria-label="Pregled cijele granice s trenutnim pogledom"></div>
      <p id="cursor-coords" class="cursor-coords" aria-hidden="true" hidden></p>
      <p id="error" class="error" role="alert" hidden></p>
    </main>
  </div>


  <script type="module" src="app.js"></script>
</body>
</html>
