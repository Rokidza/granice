# Netlify builds the site from GitHub on every push (README.md, "Objava na Netlifyju"). The layers
# come from data/out/, which is committed; the pipeline itself does not run on Netlify.
# The same headers are also written to web/dist/_headers by the build.

[build]
  command = "cd web && npm ci && npm run vendor && npm run build"
  publish = "web/dist"

[build.environment]
  NODE_VERSION = "22"

[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Referrer-Policy = "no-referrer"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"

[[headers]]
  for = "/data/*"
  [headers.values]
    Cache-Control = "no-store"
