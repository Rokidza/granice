# Deploy from a machine that has the computed data (data/ is not in git):
#   cd web && npm run vendor && npm run build
#   netlify deploy --prod --dir=web/dist
# See README.md, "Deploy na Netlify". The site is behind a login (netlify/edge-functions/auth.js).

[build]
  publish = "web/dist"

[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Referrer-Policy = "no-referrer"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"

[[headers]]
  for = "/data/*"
  [headers.values]
    Cache-Control = "no-store"
